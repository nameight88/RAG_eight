services:
  - type: web
    name: fss-rag-backend
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    # Render는 프로젝트 루트에서 빌드하므로 COPY backend/ 경로가 맞음
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: VECTOR_DB_PATH
        value: data/vector_db/fss_sanctions
      - key: VECTOR_DB_TYPE
        value: FAISS
      - key: ALLOWED_ORIGINS
        sync: false
    healthCheckPath: /health
